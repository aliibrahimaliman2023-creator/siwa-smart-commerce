name: CI
on: [push,pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python - <<'PY'
from pathlib import Path
names=[p.name for p in sorted(Path('supabase/migrations').glob('*.sql'))]
assert [p[:4] for p in names]==[f'{i:04d}' for i in range(1,41)]
PY