name: CI
on: [push,pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository layout
        run: |
          test -d supabase/migrations
          test -d supabase/functions
          test -d tests
          test -f package.json
      - name: Validate SQL ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          names=[p.name for p in sorted(Path('supabase/migrations').glob('*.sql'))]
          assert names==sorted(names), names
          assert names[0].startswith('0001_')
          assert names[-1].startswith('0010_')
          PY
      - name: Secret file guard
        run: |
          if find . -type f -name '.env' -not -path './node_modules/*' | grep -q .; then exit 1; fi
      - name: Contract tests
        run: |
          node tests/unit/pricing-contract.test.mjs
          node tests/integration/inventory-contract.test.mjs
          node tests/security/idempotency-contract.test.mjs